# station.conf: the station's tunables (ADR-006; ported from the Model 4 kiosk's
# deploy/profiles/prod.conf). Read by scripts/install-station.sh, deploy/kiosk.sh,
# deploy/reset.sh and deploy/watchdog.py.
#
# Shell syntax, but nothing here is ever run as a command: every line is NAME=value, and
# deploy/watchdog.py parses it without a shell. There are NO secrets in this file and
# there must never be: the staff PIN lives only on the station, in <data>/staff-pin,
# written there by scripts/staff-pin.py (docs/OPERATIONS.md).

# --- the page ----------------------------------------------------------------------------
KIOSK_URL=http://127.0.0.1:8080/
# Extra Chromium flags after the fixed set in kiosk.sh. Normally empty.
CHROMIUM_EXTRA=

# --- watchdogs (ARCHITECTURE 10: three layers) -------------------------------------------
# Layer 1, rigd: systemd WatchdogSec=5 (Linux) or deploy/supervise.py --watchdog-sec 5
# (macOS), fed by rigd's WATCHDOG=1 heartbeat only while the engine's frames advance.
RIGD_WATCHDOG_SEC=5
# Layer 2, the page: it POSTs /heartbeat every 10 s; unchanged for this long (on the
# monotonic clock, so a wall-clock jump never counts) and the browser is restarted.
HEARTBEAT_STALE_S=60
# After a restart, give the browser this long before judging it again (no kill loop).
WATCHDOG_COOLDOWN_S=120
# After boot, give the whole chain this long before a missing heartbeat counts.
WATCHDOG_BOOT_GRACE_S=180
# Layer 3, the kernel: systemd pets /dev/watchdog; a hung kernel is reset by hardware.
# Linux only (the Mac has no hardware watchdog a user process can arm).
HW_WATCHDOG=on
RUNTIME_WATCHDOG_SEC=60
REBOOT_WATCHDOG_SEC=120

# --- boot to playable (NFR-3, SYS-01: at most 90 s, target 60 s) -------------------------
BOOT_BUDGET_S=90
BOOT_TARGET_S=60

# --- the nightly clean restart (KIOSK-3, SYS-05) ------------------------------------------
# 03:30 is a decision, not a measurement: the museum's hours are not confirmed.
RESET_TIME=03:30
RESET_RANDOM_DELAY_S=300

# --- logs --------------------------------------------------------------------------------
# Five files of 2 MB each, per log (logrotate on Linux, deploy/supervise.py on macOS).
LOG_ROTATE_COUNT=5
LOG_ROTATE_SIZE_KB=2048
# journald on Linux: in memory only, capped (no flash wear, nothing to fill).
JOURNAL_STORAGE=volatile
JOURNAL_MAX=64M
